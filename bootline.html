<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootline</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>

<body>

    <!--Head - Navbar with Offcanvas Sidebar 
    Logo, Search bar, and placeholder picture -->

    <div class="container-fluid">

        

    <div class="navbar navbar-expand-sm d-flex col-1 col-sm-1 col-md-1 col-lg-1 col-xl-1">

        <div class="sidebarRow d-flex col-3 col-sm-3 col-md-3 col-lg-3 col-xl-3"></div>
        <button class="btn btn-primary" type="button" data-bs-toggle="" data-bs-target="offcanvas" aria-controls="offcanvas">
            =
        </button>

        
    
        <div class="offcanvas-sm col-1 col-sm-1 col-md-1 col-lg-1 col-xl-1" tabindex="-1" id="offcanvas" aria-labelledby="offcanvas">
        <div class="offcanvas-header d-flex ms-xl-5 ms-lg-5 ms-md-4">
            <h5 class="offcanvas-title" id="offcanvas">Bmail</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
         
        </div>  
        

<div class="offcanvas-body">
        <div class="list-group">
        
            <a href="#" class="list-group-item list-group-item-action text-bg-dark p-2" aria-current="true" >
                New Email
            </a>
            <a href="#" class="list-group-item list-group-item-action">Inbox</a>
            <a href="#" class="list-group-item list-group-item-action">Unread</a>
            <a href="#" class="list-group-item list-group-item-action">*Important</a>
            <a href="#" class="list-group-item list-group-item-action">Spam</a>
            <a href="#" class="list-group-item list-group-item-action">Trash</a>
            <a href="#" class="list-group-item list-group-item-action">Sent</a>
            <a href="#" class="list-group-item list-group-item-action">Draft</a>
        </div>


      </div>

      <div class="navbar-search d-flex justify-content-center justify-content-sm-center justify-content-md-center justify-content-lg-center justify-content-xl-center col-3 col-sm-3 col-md-4 col-lg-5 col-xl-5">
        <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Search" aria-labelled="Search"/>
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </form>

        <div class="navbar-user d-flex justify-content-end justify-content-sm-end justify-content-md-end justify-content-lg-end justify-content-xl-end col-1 col-sm-1 col-md-1 col-lg-1 col-xl-1">
            <img src="header.png" alt="user" class="img-fluid justify-content-end justify-content-sm-end justify-content-md-end justify-content-lg-end justify-content-xl-end"></img>

        </div>




      </div>
                
    </nav>

            </div>
</div>



</body>




</html>
